# Steamify's Fremont MFD/hwmon package. The source files are pinned in
# patches/README.md. This file is evaluated separately for every target
# kernel by DKMS.
# shellcheck shell=bash disable=SC2034,SC2154
PACKAGE_NAME="@NAME@"
PACKAGE_VERSION="@VERSION@"
AUTOINSTALL="yes"

steamify_add_module() {
    local index="$1" name="$2" symbol="$3"
    BUILT_MODULE_NAME[index]="$name"
    DEST_MODULE_LOCATION[index]="/updates/dkms"
    BUILD_EXCLUSIVE_CONFIG[index]="!$symbol"
}

# DKMS 3.4.4 treats array element zero as both the first per-module value and
# the legacy global scalar. Listing only missing modules makes that global
# check true for mixed kernels, while each later module keeps its own check.
# The Makefile independently follows the same target-kernel configuration.
if [[ ! -r "$kernel_config" ]]; then
    steamify_add_module 0 steamdeck CONFIG_MFD_STEAMDECK
    steamify_add_module 1 steamdeck_hwmon CONFIG_SENSORS_STEAMDECK
    # Never build without the target configuration: provider safety cannot be
    # established. This deliberately makes DKMS return its skip status 77.
    BUILD_EXCLUSIVE_KERNEL[0]="a^"
else
    steamify_index=0
    if ! grep -q '^CONFIG_MFD_STEAMDECK=[ym]' "$kernel_config"; then
        steamify_add_module "$steamify_index" steamdeck CONFIG_MFD_STEAMDECK
        steamify_index=$((steamify_index + 1))
    fi
    if ! grep -q '^CONFIG_SENSORS_STEAMDECK=[ym]' "$kernel_config"; then
        steamify_add_module "$steamify_index" steamdeck_hwmon CONFIG_SENSORS_STEAMDECK
        steamify_index=$((steamify_index + 1))
    fi

    if [[ $steamify_index -eq 0 ]]; then
        # A DKMS package must describe at least one module. Keeping both
        # excluded records makes a fully native kernel return status 77.
        steamify_add_module 0 steamdeck CONFIG_MFD_STEAMDECK
        steamify_add_module 1 steamdeck_hwmon CONFIG_SENSORS_STEAMDECK
    fi
    unset steamify_index
fi

unset -f steamify_add_module
